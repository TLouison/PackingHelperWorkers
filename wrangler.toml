name = "packing-helper-workers"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Model + policy config. Swapping the model here is the future "intelligence
# add-on" lever (later: resolve per-user before calling Anthropic).
[vars]
MODEL = "claude-haiku-5-5"
MONTHLY_CAP = "50"
# RevenueCat project + the Plus entitlement's v2 id (PackingHelperPlus)
RC_PROJECT_ID = "8054399d"
ENTITLEMENT_ID = "entl0ff2f65756"

[observability.logs]
enabled = true
invocation_logs = true


# Usage metering + short-lived entitlement cache.
# Create with:  wrangler kv namespace create USAGE_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "USAGE_KV"
id = "185075e67d4d41c2bd1f19e25590d759"

# Secrets (never commit — set with `wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY
#   REVENUECAT_SECRET_KEY   (RevenueCat v2 secret key)
#   UNSPLASH_ACCESS_KEY
